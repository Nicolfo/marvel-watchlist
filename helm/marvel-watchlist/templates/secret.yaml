{{- if and .Values.database.enabled (not .Values.database.existingSecret) }}
{{- if not .Values.database.url }}
{{- fail "database.enabled is true: set either database.url or database.existingSecret" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "marvel-watchlist.databaseSecretName" . }}
  labels:
    {{- include "marvel-watchlist.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.database.existingSecretKey }}: {{ .Values.database.url | quote }}
{{- end }}
{{- if and .Values.tmdb.apiKey (not .Values.tmdb.existingSecret) }}
---
# The key is only ever read server-side, to resolve which TMDB image a title
# should use. Browsers are redirected to the public image CDN, which needs no
# credential, so this never reaches a client.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "marvel-watchlist.tmdbSecretName" . }}
  labels:
    {{- include "marvel-watchlist.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.tmdb.existingSecretKey }}: {{ .Values.tmdb.apiKey | quote }}
{{- end }}
