name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  # Publish a version from the Actions UI, for when you cannot push a v* tag.
  # Run the workflow against the ref you want to release and give it a version;
  # leave the version blank to build without publishing.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 0.1.0 (blank = build only, publish nothing)"
        required: false
        default: ""
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Catches typo'd ids, duplicate/self edges and dependency cycles in
      # data/marvel-graph.json before anything else runs.
      - name: Validate dataset
        run: npm run graph:validate

      # Catches summaries keyed to a title that does not exist, and summaries
      # written for something that has not been released yet.
      - name: Validate summaries
        run: npm run summaries:validate

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint chart
        run: helm lint helm/marvel-watchlist
      - name: Render chart (defaults)
        run: helm template rel helm/marvel-watchlist > /dev/null
      - name: Render chart (all features on)
        run: |
          helm template rel helm/marvel-watchlist \
            --set ingress.enabled=true \
            --set autoscaling.enabled=true \
            --set database.enabled=true \
            --set database.url=postgresql://u:p@db:5432/marvel \
            --set tmdb.apiKey=dummy > /dev/null
      - name: Render chart (TMDB via an existing Secret)
        run: |
          helm template rel helm/marvel-watchlist \
            --set tmdb.existingSecret=tmdb > /dev/null

  # Builds the image on every commit, and publishes it to GHCR only from main
  # and version tags. Gated on build+chart so a failing test can never produce
  # a published image.
  docker:
    runs-on: ubuntu-latest
    needs: [build, chart]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Validates the manually supplied version and derives the X.Y alias, so a
      # dispatch publishes exactly what a v* tag would. The input goes through
      # an env var rather than being interpolated into the script, so it cannot
      # inject shell.
      - name: Validate dispatched version
        id: dispatch
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$VERSION' is not a semver version like 1.2.3 or 1.2.3-rc.1"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Only stable releases get the floating X.Y alias.
          if printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "minor=${VERSION%.*}" >> "$GITHUB_OUTPUT"
          fi

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        env:
          # GHCR rejects uppercase image names and the owner is "Nicolfo";
          # set explicitly rather than relying on the action's default.
          DOCKER_METADATA_IMAGE_NAME_LOWERCASE: "true"
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ steps.dispatch.outputs.version }},enable=${{ steps.dispatch.outputs.version != '' }}
            type=raw,value=${{ steps.dispatch.outputs.minor }},enable=${{ steps.dispatch.outputs.minor != '' }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          # Pull requests build only - never publish from an unmerged fork.
          # A dispatch publishes only when it supplied a version that validated.
          push: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || steps.dispatch.outputs.version != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarise
        run: |
          {
            echo "### Image"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
