name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Catches typo'd ids, duplicate/self edges and dependency cycles in
      # data/marvel-graph.json before anything else runs.
      - name: Validate dataset
        run: npm run graph:validate

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint chart
        run: helm lint helm/marvel-watchlist
      - name: Render chart (defaults)
        run: helm template rel helm/marvel-watchlist > /dev/null
      - name: Render chart (all features on)
        run: |
          helm template rel helm/marvel-watchlist \
            --set ingress.enabled=true \
            --set autoscaling.enabled=true \
            --set database.enabled=true \
            --set database.url=postgresql://u:p@db:5432/marvel > /dev/null

  # Builds the image on every commit, and publishes it to GHCR only from main
  # and version tags. Gated on build+chart so a failing test can never produce
  # a published image.
  docker:
    runs-on: ubuntu-latest
    needs: [build, chart]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        env:
          # GHCR rejects uppercase image names and the owner is "Nicolfo";
          # set explicitly rather than relying on the action's default.
          DOCKER_METADATA_IMAGE_NAME_LOWERCASE: "true"
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          # Pull requests build only - never publish from an unmerged fork.
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarise
        run: |
          {
            echo "### Image"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
