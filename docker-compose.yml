services:
  app:
    build:
      context: .
    image: marvel-watchlist:local
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      # Only needed once accounts land; the app runs fine without it.
      DATABASE_URL: postgresql://marvel:marvel@db:5432/marvel?schema=public
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 3s
      retries: 3
    depends_on:
      db:
        condition: service_healthy

  # Optional. The app does not read from Postgres yet - this is here so the
  # seed script and the future account-backed watchlist have somewhere to go.
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: marvel
      POSTGRES_PASSWORD: marvel
      POSTGRES_DB: marvel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marvel -d marvel"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
